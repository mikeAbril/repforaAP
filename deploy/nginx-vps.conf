# ============================================================
# Nginx — Configuración de Producción
# Dominio: miplanilla.devscenter.online
# ============================================================
# 
# INSTRUCCIONES DE USO EN EL VPS:
# 1. Copia este archivo al VPS:
#    scp nginx-vps.conf root@TU_IP:/etc/nginx/sites-available/miplanilla
#
# 2. Ajusta la variable ROOT_PATH abajo con la ruta real del dist
#
# 3. Activa el sitio:
#    ln -s /etc/nginx/sites-available/miplanilla /etc/nginx/sites-enabled/miplanilla
#
# 4. Verifica y recarga:
#    nginx -t && systemctl reload nginx
# ============================================================

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name miplanilla.devscenter.online;

    return 301 https://$host$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name miplanilla.devscenter.online;

    # --- Certificados SSL (Let's Encrypt / Hostinger) ---
    # Si usas Certbot, las rutas son:
    ssl_certificate     /etc/letsencrypt/live/miplanilla.devscenter.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miplanilla.devscenter.online/privkey.pem;
    # Si Hostinger gestiona el SSL, ajusta estas rutas según te indiquen en el panel.

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Tamaño máximo de petición (para subidas de archivos) ---
    client_max_body_size 20M;

    # ============================================================
    # BACKEND — Proxy inverso al puerto 3000 de Node.js
    # Todas las peticiones a /api/* van al backend
    # ============================================================
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ============================================================
    # SWAGGER DOCS — Proxy al puerto 3000
    # ============================================================
    location /api-docs/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # FRONTEND — Sirve el build estático de Vue/Vite
    # AJUSTA esta ruta a donde esté tu carpeta dist/ en el VPS
    # Ejemplo: /var/www/miplanilla/frontEnd/dist
    # ============================================================
    location / {
        root  /var/www/miplanilla/frontEnd/dist;
        index index.html;

        # Necesario para Vue Router (SPA — Single Page Application)
        try_files $uri $uri/ /index.html;

        # Cache para assets estáticos con hash (JS, CSS)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- Logs ---
    access_log /var/log/nginx/miplanilla_access.log;
    error_log  /var/log/nginx/miplanilla_error.log;
}
