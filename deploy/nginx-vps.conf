# ============================================================
# Nginx — Configuración de Producción para Ubuntu
# Dominio : miplanilla.devscenter.online
# Sistema : Ubuntu 20.04 / 22.04 / 24.04 LTS
# SSL     : Let's Encrypt con Certbot
#
# PASOS PARA USAR ESTE ARCHIVO EN EL VPS:
#
# 1. Copia el archivo al servidor:
#    scp deploy/nginx-vps.conf root@TU_IP:/etc/nginx/sites-available/miplanilla
#
# 2. Activa el sitio:
#    ln -s /etc/nginx/sites-available/miplanilla /etc/nginx/sites-enabled/miplanilla
#    rm -f /etc/nginx/sites-enabled/default
#
# 3. Si aún NO tienes SSL, instala Certbot PRIMERO:
#    apt install -y certbot python3-certbot-nginx
#    certbot --nginx -d miplanilla.devscenter.online
#    (Certbot edita el archivo automáticamente con las rutas correctas)
#
# 4. Verifica y recarga:
#    nginx -t && systemctl reload nginx
# ============================================================

# ──────────────────────────────────────────────────────────
# BLOQUE 1: Redirigir HTTP → HTTPS
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name miplanilla.devscenter.online;

    # Certbot necesita esta ubicación para verificar el dominio
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Todo lo demás, redirigir a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────
# BLOQUE 2: Servidor HTTPS principal
# ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name miplanilla.devscenter.online;

    # ── SSL — Rutas estándar de Certbot en Ubuntu ──────────
    ssl_certificate     /etc/letsencrypt/live/miplanilla.devscenter.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miplanilla.devscenter.online/privkey.pem;

    # Opciones SSL recomendadas por Certbot (Ubuntu)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Rendimiento ────────────────────────────────────────
    client_max_body_size 20M;
    keepalive_timeout    65;

    # ── Compresión Gzip (mejora la velocidad de carga) ─────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Cabeceras de seguridad ─────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"            always;
    add_header X-XSS-Protection       "1; mode=block"         always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ══════════════════════════════════════════════════════
    # BACKEND — Proxy inverso al puerto 3000 de Node.js
    # Todas las peticiones a /api/* van al backend
    # ══════════════════════════════════════════════════════
    location /api/ {
        proxy_pass          http://127.0.0.1:3000;
        proxy_http_version  1.1;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout  300s;
    }

    # ══════════════════════════════════════════════════════
    # SWAGGER DOCS — Proxy al puerto 3000
    # ══════════════════════════════════════════════════════
    location /api-docs/ {
        proxy_pass          http://127.0.0.1:3000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════════════
    # FRONTEND — Sirve el build estático de Vue/Vite
    # Ruta en Ubuntu: /var/www/miplanilla/frontEnd/dist
    # ══════════════════════════════════════════════════════
    location / {
        root  /var/www/miplanilla/frontEnd/dist;
        index index.html;

        # Necesario para Vue Router (SPA — Single Page Application)
        # Sin esto, al recargar una ruta como /supervisor dará 404
        try_files $uri $uri/ /index.html;

        # Cache agresiva para assets con hash en el nombre (JS, CSS, imágenes)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Logs (ubicación estándar en Ubuntu) ────────────────
    access_log /var/log/nginx/miplanilla_access.log;
    error_log  /var/log/nginx/miplanilla_error.log warn;
}
